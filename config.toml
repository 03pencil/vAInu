# vAInu project configuration (stdlib tomllib, Python 3.11+).
# Values derived from data/full. Do not hard-code these in Python files.

[paths]
# Root of the bundled test dataset. Use "data/full" or "data/starter".
data_dir = "data/full"
# Available tiers for quick switching.
tiers = ["full", "starter"]

[assets]
# All asset IDs found in data/full/assets.csv
ids = [
  "PUMP-01", "PUMP-02", "PUMP-03", "PUMP-04",
  "PUMP-05", "PUMP-06", "PUMP-07", "PUMP-08",
  "PUMP-09", "PUMP-10", "PUMP-11", "PUMP-12",
]

[channels]
# All sensor channels found across data/full/assets.csv (channels_available).
names = [
  "ambient_temp_c", "bearing_temp_c", "discharge_pressure_kpa",
  "flow_m3_h", "fluid_temp_c", "motor_current_a", "motor_power_kw",
  "motor_speed_rpm", "motor_winding_temp_c", "suction_pressure_kpa",
  "valve_position_pct", "vibration_accel_rms_g", "vibration_crest_factor",
  "vibration_rms_mm_s",
]

[analysis]
# Window size for rolling statistics.
rolling_window = 5
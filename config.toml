# vAInu project configuration (stdlib tomllib, Python 3.11+).
# Values derived from data/full. Do not hard-code these in Python files.

[paths]
# Root of the bundled test dataset. Use "data/full" or "data/starter".
# The full tier stores telemetry as telemetry/asset_id=*/day=*/part-0.parquet
# (1 s grid); the starter tier uses telemetry.csv.gz (10 s grid).
# NOTE: this repo's data/full has no telemetry folder; point data_dir at a
# provisioned copy of the full tier before running.
data_dir = "data/full"
# Available tiers for quick switching.
tiers = ["full", "starter"]

[assets]
# All asset IDs found in data/full/assets.csv
ids = [
  "PUMP-01", "PUMP-02", "PUMP-03", "PUMP-04",
  "PUMP-05", "PUMP-06", "PUMP-07", "PUMP-08",
  "PUMP-09", "PUMP-10", "PUMP-11", "PUMP-12",
]

[channels]
# All sensor channels found across data/full/assets.csv (channels_available).
names = [
  "ambient_temp_c", "bearing_temp_c", "discharge_pressure_kpa",
  "flow_m3_h", "fluid_temp_c", "motor_current_a", "motor_power_kw",
  "motor_speed_rpm", "motor_winding_temp_c", "suction_pressure_kpa",
  "valve_position_pct", "vibration_accel_rms_g", "vibration_crest_factor",
  "vibration_rms_mm_s",
]

[analysis]
# Window size for rolling statistics.
rolling_window = 5
# Modified z-score threshold for raising a per-channel alarm.
z_threshold = 3.0
# Smoothing window in samples for alarm decisions (10 s grid -> 60 = 10 min,
# matching how the benchmark defines detectability).
smoothing_window = 60

[compute]
# Worker processes for the per-asset math (the rolling z surface dominates
# the build). 0 = auto: every logical CPU but one. Set 1 for the serial path.
workers = 0

[trend]
# Layer 1 item 3: trailing-drift extrapolation -> time-to-limit.
# Forecasts run on short-interval RUNNING-row medians (bin_minutes),
# matching the benchmark detectability grid; the drift is fit over
# trailing_hours and needs min_fit_points valid bins inside it.
bin_minutes = 10
trailing_hours = 12.0
# A bin is valid when it holds at least min_bin_count samples inside the
# trailing window at least min_fit_points bins must hold data (T1
# sparse wireless channels update every 300 s -> few samples per bin).
min_bin_count = 2
min_fit_points = 36

[limits]
# Static alarm limits for channels that have no limit column in
# assets.csv (values from simulation_assumptions.md: bearing caution
# band 82 C / alarm 85 C; winding class-F alarm 140 C). Vibration
# limits come from assets.csv (vibration_alarm_mm_s) instead.
bearing_temp_c = 85.0
motor_winding_temp_c = 140.0

[debounce]
# Alarm-burst debouncing: a raw z alarm becomes CONFIRMED only after it
# held for confirm_samples consecutive rows inside one asset (3 min on
# the 10 s grid), and ESCALATED after escalate_samples (30 min). This
# is the FAR-reduction surface (to-do M4: target < 2 %).
confirm_samples = 18
escalate_samples = 180

[web_ui]
# Local dashboard defaults. Use --host 10.20.3.13 to expose it on the board's LAN address.
host = "127.0.0.1"
port = 8000
# Browser polling interval (seconds) and samples returned per chart window.
refresh_seconds = 2
history_samples = 600
# Chart-window choices in seconds; the UI converts them to samples using the
# telemetry grid (1 s on the full tier, 10 s on the starter tier).
window_intervals = [10, 60, 600, 1800, 3600]
# |z| >= z_threshold * watch_fraction is shown as WATCH (below ALARM).
watch_fraction = 0.5
# Severity gauge shown in the UI: 0 = no deviation, alarm_mark = the z
# threshold, 100 = 3x the threshold (and anything above).
alarm_mark = 80
# Preferred chart channel; when it has no reading, the channel that best
# explains the current status is shown instead.
default_channel = "vibration_rms_mm_s"
# Finished alarm surface kept on disk so a restart skips the rebuild.
# Relative paths resolve from the repository root; "" disables the cache.
cache_dir = "cache/web_ui"

[llm]
# Batch narration (scripts/narrate.py): SmolLM explains pilot alarms in plain
# language. It never changes status, numbers or data. Off by default: with
# enabled = false the script writes template text only.
enabled = false
# Ollama on the board (or a local PC for testing).
base_url = "http://127.0.0.1:11434"
model = "smollm2:1.7b"
# Seconds per request. A 1.7B model on the UNO Q runs at roughly 5 tokens/s.
timeout_seconds = 180
max_tokens = 256
# Extra attempts after an answer fails validation; each retry lists the broken rules.
retries = 2
# Most records narrated per run, most severe first.
max_records_per_run = 20
# Window for the "alarm entries" count shown to the model.
history_hours = 24
